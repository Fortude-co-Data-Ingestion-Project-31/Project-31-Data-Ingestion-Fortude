name: CI

# This workflow provides continuous integration for both the backend and frontend.
# It runs on every push and pull request so that regressions are caught early.
on:
  push:
    branches:
      - main
      - develop
      - ci-cd-pipeline
  pull_request:
    branches:
      - main
      - develop
      - ci-cd-pipeline

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          # Skip integration tests that depend on external services in CI.
           pytest -q -m "not integration" --ignore=tests/mongo_db_test -c pytest.ini

  frontend-build:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend application
        working-directory: frontend
        run: npm run build
